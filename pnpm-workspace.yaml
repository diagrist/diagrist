packages:
  - packages/*
  - plugins/*

# Supply chain (pnpm 11). The first three are pnpm defaults, pinned here on purpose.
minimumReleaseAge: 1440 # install new versions only after 24 hours
blockExoticSubdeps: true # no git or tarball sources in transitive dependencies
strictDepBuilds: true # install scripts only when listed in allowBuilds
trustPolicy: no-downgrade # reject a version whose provenance is weaker than before
allowBuilds: {}
trustPolicyExclude:
  # Reviewed 2026-10-24: published 2024-11-13 by the Node maintainers, before provenance was added
  # in later 6.x releases. @types/node@22 requires exactly ~6.21.0.
  - undici-types@6.21.0
