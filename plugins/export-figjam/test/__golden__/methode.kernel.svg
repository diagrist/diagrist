<g id="node-submit"><rect x="60" y="92" width="534" height="268" rx="4" class="code-card"/><text x="74" y="112" class="card-title">TransferService.submit</text><text x="580" y="112" text-anchor="end" class="card-meta">TransferService.java · 25-36</text><line x1="60" y1="124" x2="594" y2="124" class="hairline"/><rect x="61" y="171" width="532" height="70" class="band"/><rect x="61" y="171" width="3" height="70" class="band-edge"/><rect x="61" y="243" width="532" height="16" class="band"/><rect x="61" y="243" width="3" height="16" class="band-edge"/><rect x="61" y="297" width="532" height="16" class="band"/><rect x="61" y="297" width="3" height="16" class="band-edge"/><text x="88" y="147" text-anchor="end" class="code-number">25</text><text x="104" y="147" class="code-text"><tspan class="code-annotation">@Transactional</tspan></text><text x="88" y="165" text-anchor="end" class="code-number">26</text><text x="104" y="165" class="code-text"><tspan class="code-keyword">public </tspan><tspan class="code-type">TransferId </tspan><tspan class="code-function">submit</tspan>(<tspan class="code-type">SubmitTransfer</tspan> cmd) {</text><text x="88" y="183" text-anchor="end" class="code-number">27</text><text x="104" y="183" xml:space="preserve" class="code-text">    <tspan class="code-keyword">var</tspan> existing = transfers.<tspan class="code-function">findByIdempotencyKey</tspan>(cmd.<tspan class="code-function">idempotencyKey</tspan>());</text><text x="88" y="201" text-anchor="end" class="code-number">28</text><text x="104" y="201" xml:space="preserve" class="code-text">    <tspan class="code-keyword">if</tspan> (existing.<tspan class="code-function">isPresent</tspan>()) {</text><text x="88" y="219" text-anchor="end" class="code-number">29</text><text x="104" y="219" xml:space="preserve" class="code-text">        <tspan class="code-keyword">return</tspan> existing.<tspan class="code-function">get</tspan>().<tspan class="code-function">id</tspan>();</text><text x="88" y="237" text-anchor="end" class="code-number">30</text><text x="104" y="237" xml:space="preserve" class="code-text">    }</text><text x="88" y="255" text-anchor="end" class="code-number">31</text><text x="104" y="255" xml:space="preserve" class="code-text">    limits.<tspan class="code-function">check</tspan>(cmd.<tspan class="code-function">debtor</tspan>(), cmd.<tspan class="code-function">amount</tspan>());</text><text x="88" y="273" text-anchor="end" class="code-number">32</text><text x="104" y="273" xml:space="preserve" class="code-text">    <tspan class="code-keyword">var</tspan> transfer = Transfer.<tspan class="code-function">accept</tspan>(cmd);</text><text x="88" y="291" text-anchor="end" class="code-number">33</text><text x="104" y="291" xml:space="preserve" class="code-text">    transfers.<tspan class="code-function">save</tspan>(transfer);</text><text x="88" y="309" text-anchor="end" class="code-number">34</text><text x="104" y="309" xml:space="preserve" class="code-text">    outbox.<tspan class="code-function">publish</tspan>(<tspan class="code-keyword">new </tspan><tspan class="code-function">TransferAccepted</tspan>(transfer.<tspan class="code-function">id</tspan>(), cmd.<tspan class="code-function">amount</tspan>()));</text><text x="88" y="327" text-anchor="end" class="code-number">35</text><text x="104" y="327" xml:space="preserve" class="code-text">    <tspan class="code-keyword">return</tspan> transfer.<tspan class="code-function">id</tspan>();</text><text x="88" y="345" text-anchor="end" class="code-number">36</text><text x="104" y="345" class="code-text">}</text><circle cx="44" cy="179" r="8" class="badge"/><text x="44" y="182.4" text-anchor="middle" class="badge-text">1</text><circle cx="44" cy="251" r="8" class="badge"/><text x="44" y="254.4" text-anchor="middle" class="badge-text">2</text><circle cx="44" cy="305" r="8" class="badge"/><text x="44" y="308.4" text-anchor="middle" class="badge-text">3</text><circle cx="68" cy="386" r="8" class="badge"/><text x="68" y="389.4" text-anchor="middle" class="badge-text">1</text><text x="84" y="389" class="note-text">Idempotenz: ein zweiter Aufruf mit demselben Schlüssel liefert die erste Überweisung zurück.</text><circle cx="68" cy="410" r="8" class="badge"/><text x="68" y="413.4" text-anchor="middle" class="badge-text">2</text><text x="84" y="413" class="note-text">Das Tageslimit wird vor dem Buchen geprüft, synchron und lokal.</text><circle cx="68" cy="434" r="8" class="badge"/><text x="68" y="437.4" text-anchor="middle" class="badge-text">3</text><text x="84" y="437" class="note-text">Das Event geht in derselben Transaktion in die Outbox, nicht direkt an Kafka.</text></g>
