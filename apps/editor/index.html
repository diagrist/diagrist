<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Diagrist Editor</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="bar" id="bar">
      <strong class="brand">Diagrist</strong>
      <select id="examples" aria-label="Load an example">
        <option value="">Examples …</option>
      </select>
      <span class="spacer"></span>
      <span class="switch">
        <button type="button" id="show-source" aria-pressed="true">Source</button>
        <button type="button" id="show-picture" aria-pressed="false">Picture</button>
      </span>
      <button id="share" type="button">Copy link</button>
      <button id="embed" type="button">Embed</button>
      <details class="menu" id="download">
        <summary>Download</summary>
        <div class="menu-items">
          <button id="svg" type="button">SVG</button>
          <button id="png" type="button">PNG</button>
          <button id="dgr" type="button">Source (.dgr)</button>
        </div>
      </details>
    </header>
    <main class="split" id="split" data-show="source">
      <section class="left">
        <div id="editor" class="editor"></div>
        <ul id="findings" class="findings" aria-live="polite"></ul>
      </section>
      <hr
        class="divider"
        id="divider"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="Width of the source"
        aria-valuemin="20"
        aria-valuemax="80"
        aria-valuenow="40"
      />
      <section class="right">
        <div id="preview" class="preview"></div>
        <div class="zoom" role="toolbar" aria-label="Zoom">
          <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (-)">−</button>
          <output id="zoom-level" aria-live="off">100 %</output>
          <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
          <button id="zoom-fit" type="button" title="Fit the picture (0)" aria-pressed="true">Fit</button>
          <button id="zoom-actual" type="button" title="Actual size (1)">1:1</button>
        </div>
      </section>
    </main>
    <dialog id="embed-dialog">
      <form method="dialog">
        <h2>Embed</h2>
        <p>Confluence: type <code>/iframe</code>, paste the address and set a height.</p>
        <label>Address for the iframe
          <textarea id="embed-url" rows="3" readonly></textarea>
        </label>
        <label>HTML
          <textarea id="embed-html" rows="4" readonly></textarea>
        </label>
        <p class="note" id="embed-size"></p>
        <p class="note">The source sits in the link behind the <code>#</code>. Browsers never send that part to a server; the diagram is drawn in the browser.</p>
        <div class="actions">
          <button type="button" id="copy-url">Copy address</button>
          <button type="button" id="copy-html">Copy HTML</button>
          <button type="submit" value="close">Close</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
